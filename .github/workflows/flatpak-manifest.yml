name: Flatpak Manifest

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  manifest-contract:
    name: Validate permissions and source pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/check_flatpak_manifest.py
